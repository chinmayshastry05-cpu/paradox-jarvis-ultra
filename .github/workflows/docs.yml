# Docs site build (MkDocs).
#
# Builds the docs site. At build time the Supabase anon key is injected
# into docs/javascripts/leaderboard-config.js from the
# VITE_SUPABASE_ANON_KEY repository variable (non-secret config - the anon key is public-by-design; no secret is baked into the built artifact). The savings leaderboard reads it
# from window.OPENJARVIS_SUPABASE_ANON_KEY. The checked-in config file
# keeps the key empty; only the built site carries the real key.
#
# Trigger is manual-only (workflow_dispatch) until the owner wires up
# Pages deployment after review. This workflow builds and uploads the
# site as an artifact; it does not publish anything.
name: Docs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install docs dependencies
        run: uv sync --extra docs
      - name: Inject Supabase anon key into leaderboard config
        env:
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          cat > docs/javascripts/leaderboard-config.js <<EOF
          // Generated at docs-build time from the VITE_SUPABASE_ANON_KEY repository variable.
          // Do not edit by hand; the checked-in file keeps the key empty.
          window.OPENJARVIS_SUPABASE_ANON_KEY = "${VITE_SUPABASE_ANON_KEY}";
          EOF
      - name: Build docs site
        run: uv run mkdocs build
      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site
